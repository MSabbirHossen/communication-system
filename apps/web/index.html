<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!--
      Development CSP. Vite injects inline styles in dev, hence 'unsafe-inline' for styles.
      'wasm-unsafe-eval' lets the browser compile the Rust crypto WebAssembly module (it does
      not permit eval of JavaScript); blob: workers are created by the SDK. Production
      hardening (nonces/hashes, exact origins, no unsafe-inline) is a Phase 4/7 task
      (THREAT_MODEL TM-11). No third-party scripts are allowed at any stage.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://localhost:8008 http://localhost:3000 ws://localhost:5173; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="referrer" content="no-referrer" />
    <title>Communication System</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
