name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Format, lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Dependency audit (high and above; advisory until Phase 7)
        run: pnpm audit --audit-level=high
        continue-on-error: true

  secrets-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dev-env:
    # Proves the documented local environment: docker compose (Synapse + MongoDB),
    # the init script, the API reaching readiness against Mongo, and the Phase 0
    # PoC passing against the compose Synapse. Results are published as check
    # annotations (public) because logs and summaries need a sign-in.
    name: Dev environment (compose + API readiness + PoC)
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Validate compose file
        run: docker compose -f infrastructure/docker-compose.yml config --quiet

      - name: Initialise Synapse config (init script)
        run: node infrastructure/synapse/init.mjs

      - name: Start services
        run: |
          set -euo pipefail
          docker compose -f infrastructure/docker-compose.yml up -d
          for i in $(seq 1 60); do
            s=$(docker inspect --format '{{.State.Health.Status}}' cs-synapse 2>/dev/null || echo starting)
            m=$(docker inspect --format '{{.State.Health.Status}}' cs-mongo 2>/dev/null || echo starting)
            echo "synapse=$s mongo=$m"
            if [ "$s" = healthy ] && [ "$m" = healthy ]; then break; fi
            sleep 3
          done
          docker compose -f infrastructure/docker-compose.yml ps
          curl -fsS http://localhost:8008/_matrix/client/versions >/dev/null
          curl -fsS http://localhost:8008/_synapse/admin/v1/server_version | tee "$RUNNER_TEMP/server-version.json"
          echo
          echo "::notice title=register probe::$(curl -sS -X POST -H 'content-type: application/json' -d '{}' http://localhost:8008/_matrix/client/v3/register | cut -c1-300)"

      - name: Build and start the API against compose MongoDB
        env:
          NODE_ENV: development
          PORT: 3000
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB_NAME: communication_system_ci
          LOG_LEVEL: info
          CORS_ORIGINS: http://localhost:5173
        run: |
          set -euo pipefail
          pnpm build:packages
          pnpm --filter @cs/api build
          node apps/api/dist/index.js > "$RUNNER_TEMP/api.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/api.pid"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/v1/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:3000/api/v1/health | tee "$RUNNER_TEMP/health.json"
          echo
          code=$(curl -sS -o "$RUNNER_TEMP/ready.json" -w '%{http_code}' http://localhost:3000/api/v1/ready)
          cat "$RUNNER_TEMP/ready.json"; echo
          echo "::notice title=api::health=$(cat "$RUNNER_TEMP/health.json") ready_http=$code ready=$(cat "$RUNNER_TEMP/ready.json")"
          test "$code" = "200"
          # The API log must contain request lines and never the value of an auth header.
          # (A throwaway probe value, assembled at runtime so secret scanners do not flag it.)
          probe="syt_ci_probe_$(date +%s)"
          curl -sS -H "authorization: Bearer $probe" http://localhost:3000/api/v1/health >/dev/null
          sleep 1
          grep -q '"route":"/health"' "$RUNNER_TEMP/api.log"
          ! grep -q "$probe" "$RUNNER_TEMP/api.log"

      - name: Run the Phase 0 PoC against the compose Synapse
        run: |
          set -o pipefail
          pnpm poc 2>&1 | tee "$RUNNER_TEMP/poc.log"
        env:
          HOMESERVER_URL: http://localhost:8008

      - name: Inspect the compose Synapse database and log for plaintext
        run: |
          set -o pipefail
          docker compose -f infrastructure/docker-compose.yml stop synapse
          docker logs cs-synapse > "$RUNNER_TEMP/synapse-container.log" 2>&1
          # Inspect a copy owned by the runner: SQLite needs the directory writable
          # (WAL/shm side files) even for a read-only open.
          mkdir -p "$RUNNER_TEMP/dbcopy"
          sudo cp infrastructure/synapse/data/homeserver.db* "$RUNNER_TEMP/dbcopy/"
          sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/dbcopy"
          ls -la "$RUNNER_TEMP/dbcopy"
          pnpm poc:inspect -- --db "$RUNNER_TEMP/dbcopy/homeserver.db" --log "$RUNNER_TEMP/synapse-container.log" 2>&1 | tee "$RUNNER_TEMP/inspect.log"

      - name: Publish results as annotations (readable without sign-in)
        if: always()
        run: |
          echo "::notice title=synapse::server=$(cat "$RUNNER_TEMP/server-version.json" 2>/dev/null || echo 'not started')"
          if [ -f "$RUNNER_TEMP/poc.log" ]; then
            echo "::notice title=poc::$(grep -E '^==' "$RUNNER_TEMP/poc.log" | tail -n 1)"
            echo "::notice title=poc::PASS=$(grep -c '^PASS' "$RUNNER_TEMP/poc.log") FAIL=$(grep -c '^FAIL' "$RUNNER_TEMP/poc.log")"
            grep -E '^(FAIL|ERROR)' "$RUNNER_TEMP/poc.log" | head -n 8 | while IFS= read -r l; do echo "::error title=poc::$l"; done
          else
            echo "::error title=poc::PoC did not run"
          fi
          if [ -f "$RUNNER_TEMP/inspect.log" ]; then
            echo "::notice title=inspect::$(grep -E '^==' "$RUNNER_TEMP/inspect.log" | tail -n 1)"
            echo "::notice title=inspect::PASS=$(grep -c '^PASS' "$RUNNER_TEMP/inspect.log") FAIL=$(grep -c '^FAIL' "$RUNNER_TEMP/inspect.log")"
            grep -E '^FAIL' "$RUNNER_TEMP/inspect.log" | head -n 8 | while IFS= read -r l; do echo "::error title=inspect::$l"; done
            if ! grep -q '^PASS' "$RUNNER_TEMP/inspect.log"; then
              grep -v '^\s*$' "$RUNNER_TEMP/inspect.log" | grep -vE 'ExperimentalWarning|trace-warnings' | tail -n 6 | while IFS= read -r l; do echo "::error title=inspect crashed::$l"; done
            fi
          fi
          if [ -f "$RUNNER_TEMP/api.log" ]; then
            grep -iE '"level":"(error|fatal)"' "$RUNNER_TEMP/api.log" | tail -n 5 | while IFS= read -r l; do echo "::warning title=api log::$l"; done
          fi

      - name: Tear down
        if: always()
        run: |
          [ -f "$RUNNER_TEMP/api.pid" ] && kill "$(cat "$RUNNER_TEMP/api.pid")" 2>/dev/null || true
          docker compose -f infrastructure/docker-compose.yml down --volumes || true

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-env-evidence
          path: |
            poc/matrix-e2ee/last-run.json
            ${{ runner.temp }}/poc.log
            ${{ runner.temp }}/inspect.log
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/synapse-container.log
          if-no-files-found: ignore

  poc-e2ee:
    # Phase 0 proof of concept against a *current* Synapse in Docker.
    # Verifies that two accounts exchange an encrypted DM, that the server
    # stores ciphertext only, and that no plaintext fallback occurs.
    # Everything a reviewer needs is written to the job summary, which is
    # readable on the public run page without signing in.
    name: E2EE proof of concept (Synapse in Docker)
    runs-on: ubuntu-latest
    needs: checks
    env:
      SYNAPSE_IMAGE: ghcr.io/element-hq/synapse:latest
    steps:
      - name: Set paths
        run: echo "SYNAPSE_DIR=$RUNNER_TEMP/synapse" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Pull Synapse image
        run: |
          set -euxo pipefail
          docker version --format 'client={{.Client.Version}} server={{.Server.Version}}'
          docker pull "$SYNAPSE_IMAGE"
          docker image inspect "$SYNAPSE_IMAGE" --format '{{index .RepoDigests 0}}' | tee "$RUNNER_TEMP/image-digest.txt"

      - name: Generate Synapse config
        run: |
          set -euxo pipefail
          mkdir -p "$SYNAPSE_DIR"
          chmod 777 "$SYNAPSE_DIR"
          # UID/GID make the image write its files as the runner user, so the
          # overrides below can be appended and the DB read afterwards.
          docker run --rm \
            -v "$SYNAPSE_DIR:/data" \
            -e SYNAPSE_SERVER_NAME=localhost \
            -e SYNAPSE_REPORT_STATS=no \
            -e UID="$(id -u)" -e GID="$(id -g)" \
            "$SYNAPSE_IMAGE" generate 2>&1 | tee "$RUNNER_TEMP/generate.log" \
            || { tail -n 8 "$RUNNER_TEMP/generate.log" | while IFS= read -r l; do echo "::error title=synapse generate::$l"; done; exit 1; }
          ls -la "$SYNAPSE_DIR"
          # Dev-only overrides: open registration without verification so the
          # PoC can create throwaway accounts. Never use these in production.
          # The generated file has no trailing newline, so start on a fresh line.
          printf '\n' >> "$SYNAPSE_DIR/homeserver.yaml"
          cat >> "$SYNAPSE_DIR/homeserver.yaml" <<'EOF'
          enable_registration: true
          enable_registration_without_verification: true
          suppress_key_server_warning: true
          rc_registration:
            per_second: 100
            burst_count: 100
          rc_login:
            address: { per_second: 100, burst_count: 100 }
            account: { per_second: 100, burst_count: 100 }
            failed_attempts: { per_second: 100, burst_count: 100 }
          rc_message:
            per_second: 100
            burst_count: 100
          EOF
          grep -nE '^(server_name|enable_registration|report_stats):' "$SYNAPSE_DIR/homeserver.yaml"

      - name: Start Synapse
        run: |
          set -euxo pipefail
          docker run -d --name synapse \
            -v "$SYNAPSE_DIR:/data" \
            -p 8008:8008 \
            -e UID="$(id -u)" -e GID="$(id -g)" \
            "$SYNAPSE_IMAGE"
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8008/_matrix/client/versions >/dev/null; then echo "Synapse ready after ${i}x2s"; break; fi
            sleep 2
          done
          curl -fsS http://localhost:8008/_matrix/client/versions | tee "$RUNNER_TEMP/versions.json"
          echo
          curl -fsS http://localhost:8008/_synapse/admin/v1/server_version | tee "$RUNNER_TEMP/server-version.json"
          echo
          # Public diagnostic: registration must answer 401 with UIA flows, not 403.
          echo "::notice title=register probe::$(curl -sS -X POST -H 'content-type: application/json' -d '{}' http://localhost:8008/_matrix/client/v3/register | cut -c1-300)"

      - name: Run PoC (two accounts, encrypted DM, offline catch-up, no plaintext fallback)
        run: |
          set -o pipefail
          pnpm poc 2>&1 | tee "$RUNNER_TEMP/poc.log"
        env:
          HOMESERVER_URL: http://localhost:8008

      - name: Inspect server database for plaintext
        run: |
          set -o pipefail
          docker stop synapse
          # The image logs to stdout; capture it so the inspector can scan it for plaintext.
          docker logs synapse > "$RUNNER_TEMP/synapse-container.log" 2>&1
          sudo chmod -R a+r "$SYNAPSE_DIR"
          cp "$RUNNER_TEMP/synapse-container.log" "$SYNAPSE_DIR/homeserver.log"
          pnpm poc:inspect -- --db "$SYNAPSE_DIR/homeserver.db" --log "$SYNAPSE_DIR/homeserver.log" 2>&1 | tee "$RUNNER_TEMP/inspect.log"

      - name: Publish result as annotations (readable without sign-in)
        if: always()
        run: |
          # GitHub shows logs and summaries only to signed-in users; annotations
          # are public via the checks API. Limit: 10 notices + 10 errors per step.
          echo "::notice title=synapse::image=$SYNAPSE_IMAGE digest=$(cat "$RUNNER_TEMP/image-digest.txt" 2>/dev/null || echo none) server=$(cat "$RUNNER_TEMP/server-version.json" 2>/dev/null || echo 'not started')"
          if [ -f "$RUNNER_TEMP/poc.log" ]; then
            echo "::notice title=poc::$(grep -E '^==' "$RUNNER_TEMP/poc.log" | tail -n 1)"
            echo "::notice title=poc::PASS=$(grep -c '^PASS' "$RUNNER_TEMP/poc.log") FAIL=$(grep -c '^FAIL' "$RUNNER_TEMP/poc.log")"
            grep -E '^(FAIL|ERROR)' "$RUNNER_TEMP/poc.log" | head -n 8 | while IFS= read -r l; do echo "::error title=poc::$l"; done
          else
            echo "::error title=poc::PoC did not run"
          fi
          if [ -f "$RUNNER_TEMP/inspect.log" ]; then
            echo "::notice title=inspect::$(grep -E '^==' "$RUNNER_TEMP/inspect.log" | tail -n 1)"
            echo "::notice title=inspect::PASS=$(grep -c '^PASS' "$RUNNER_TEMP/inspect.log") FAIL=$(grep -c '^FAIL' "$RUNNER_TEMP/inspect.log")"
            grep -E '^FAIL' "$RUNNER_TEMP/inspect.log" | head -n 8 | while IFS= read -r l; do echo "::error title=inspect::$l"; done
          fi
          if docker ps -a --format '{{.Names}}' | grep -q '^synapse$'; then
            docker logs synapse 2>&1 | grep -iE 'error|traceback|exception' | tail -n 5 | while IFS= read -r l; do echo "::warning title=synapse log::$l"; done
          fi

      - name: Write job summary
        if: always()
        run: |
          {
            echo "## Phase 0 E2EE PoC against current Synapse"
            echo
            echo "- Image: \`$SYNAPSE_IMAGE\` → \`$(cat "$RUNNER_TEMP/image-digest.txt" 2>/dev/null || echo 'not pulled')\`"
            echo "- Server version: \`$(cat "$RUNNER_TEMP/server-version.json" 2>/dev/null || echo 'not started')\`"
            echo
            echo "### PoC checks"
            echo '```'
            grep -E '^(PASS|FAIL|==|ERROR)' "$RUNNER_TEMP/poc.log" 2>/dev/null || echo "(no PoC output)"
            echo '```'
            echo "### Server inspection"
            echo '```'
            grep -vE 'ExperimentalWarning|trace-warnings' "$RUNNER_TEMP/inspect.log" 2>/dev/null || echo "(no inspection output)"
            echo '```'
            if [ -f "$RUNNER_TEMP/generate.log" ]; then
              echo "### Synapse generate output (last 40 lines)"
              echo '```'
              tail -n 40 "$RUNNER_TEMP/generate.log"
              echo '```'
            fi
            if docker ps -a --format '{{.Names}}' | grep -q '^synapse$'; then
              echo "### Synapse container log (last 40 lines)"
              echo '```'
              docker logs synapse 2>&1 | tail -n 40
              echo '```'
            fi
            if [ -f "$RUNNER_TEMP/poc.log" ]; then
              echo "<details><summary>Full PoC log (last 150 lines)</summary>"
              echo
              echo '```'
              tail -n 150 "$RUNNER_TEMP/poc.log"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload PoC evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poc-evidence
          path: |
            poc/matrix-e2ee/last-run.json
            ${{ runner.temp }}/poc.log
            ${{ runner.temp }}/inspect.log
            ${{ runner.temp }}/generate.log
            ${{ runner.temp }}/synapse/homeserver.log
          if-no-files-found: ignore
