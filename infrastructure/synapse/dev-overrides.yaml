# --- Development-only overrides appended by infrastructure/synapse/init.mjs ---
# Open, unverified registration and relaxed rate limits so local clients and the
# Phase 0 PoC can create throwaway accounts. NEVER use these values in production.
enable_registration: true
enable_registration_without_verification: true
suppress_key_server_warning: true
rc_registration:
  per_second: 100
  burst_count: 100
rc_login:
  address: { per_second: 100, burst_count: 100 }
  account: { per_second: 100, burst_count: 100 }
  failed_attempts: { per_second: 100, burst_count: 100 }
rc_message:
  per_second: 100
  burst_count: 100
# Refresh tokens (MSC2918). Clients that ask for a refresh token at login get a short-lived
# access token and must refresh it; stolen access tokens therefore expire quickly
# (THREAT_MODEL TM-06). CI shortens the access-token lifetime to exercise expiry.
refreshable_access_token_lifetime: 5m
refresh_token_lifetime: 30d
